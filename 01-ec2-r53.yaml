- name: create ec2 and r53
  hosts: local
  connection: local
  vars:
    ami-id: ami-09c813fb71547fc4f
    sg-id: sg-037ea79c954371756
    zone-id: Z0476340LOT78SX6IPUE
    domain-name: "hhrp.life"
    instances:
    - mongodb
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the ec2_output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"       
